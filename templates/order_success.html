{% extends 'base.html' %}
{% block title %}Order Success{% endblock %}
{% block content %}
<div class="text-center mt-5">
    <h1 class="text-success">Order Placed Successfully!</h1>
    <p>Your order #{{ order.id }} has been received and is pending payment.</p>
    <button id="payNowBtn" class="btn btn-warning btn-lg mt-3">💳 Pay Now (Simulate)</button>
    <div id="paymentResult" class="mt-3"></div>
    <a href="{% url 'home' %}" class="btn btn-primary mt-3">Continue Shopping</a>
</div>

<script>
document.getElementById('payNowBtn').addEventListener('click', function() {
    const csrftoken = getCookie('csrftoken');
    fetch("{% url 'simulate-payment' order.id %}", {
        method: 'POST',
        headers: {
            'X-CSRFToken': csrftoken,
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({})
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            document.getElementById('paymentResult').innerHTML = 
                '<p class="text-success">✅ Payment successful! Transaction ID: ' + data.message + '</p>';
            document.getElementById('payNowBtn').disabled = true;
        }
    })
    .catch(err => {
        document.getElementById('paymentResult').innerHTML = 
            '<p class="text-danger">❌ Payment failed. Please try again.</p>';
    });
});

// 从 Cookie 获取 CSRF token
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
{% endblock %}
